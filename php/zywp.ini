; Zynkria PHP-FPM overrides. CLI remains on the distribution defaults.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/log/zywp/php-error.log
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000
cgi.fix_pathinfo = 0
session.use_strict_mode = 1
session.cookie_httponly = 1
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
