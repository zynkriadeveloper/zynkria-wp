# Zynkria managed single-site virtual host. Do not add a second PHP handler.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    root @WEBROOT@;
    index index.php;
    server_tokens off;
    client_max_body_size 64m;
    access_log /var/log/nginx/zywp-access.log;
    error_log /var/log/nginx/zywp-error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    include /etc/nginx/zywp/wordpress-rules.conf;

    location / { try_files $uri $uri/ /index.php?$args; }
    location = /wp-config.php { deny all; }
    location = /xmlrpc.php { deny all; }
    location ~* ^/wp-content/uploads/.*\.php(?:/|$) { deny all; }
    location ~ /\. { deny all; }
    location ~* \.(?:sql|bak|ini|log|sh|old|swp)$ { deny all; }
    location ~ \.php$ {
        gzip off;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/zywp.sock;
        fastcgi_read_timeout 60s;
    }
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|ico|svg|woff|woff2)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
}
