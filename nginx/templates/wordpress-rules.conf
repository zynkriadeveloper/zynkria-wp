# Compress static text assets only. Dynamic HTML is left uncompressed to
# reduce compression side channels for authenticated pages (BREACH).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied no-cache no-store private expired auth;
gzip_types text/plain text/css application/javascript application/json
           application/xml image/svg+xml;
# Nginx also compresses text/html by default; turn it off in the PHP location.
