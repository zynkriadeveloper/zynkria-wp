name: Validate scripts and templates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck nginx php8.3-fpm
      - name: Syntax, lint, terminal input and native config checks
        run: sudo bash tests/run.sh --config
